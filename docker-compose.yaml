services:
  desktop-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: flowera

    ports:
      - "8080:8080"

    environment:
      DESKTOP_HOST: localhost

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - flowera-network

    restart: unless-stopped

networks:
  flowera-network:
    name: flowera-network