services:
  desktop-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: flowera

    ports:
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Task records, chats, help requests, worker memory and action
      # screenshots (flowera.db). Without a volume, every rebuild of this
      # container would start the records from nothing.
      - flowera-data:/data

    environment:
      - FLOWERA_DATA_DIR=/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - flowera-network

    restart: unless-stopped

networks:
  flowera-network:
    name: flowera-network

volumes:
  flowera-data:
    name: flowera-data
