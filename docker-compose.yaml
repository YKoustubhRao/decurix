services:
  desktop-manager:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: flowera

    ports:
      - "8080:8080"
      # The LAN/tunnel-facing listener (internal/lanaccess) - gated by an
      # access code, unlike 8080 above. What a Cloudflare tunnel or a direct
      # LAN address should be pointed at. FLOWERA_LAN_PORT in .env changes
      # the port on both sides at once (compose's own variable substitution
      # here; the binary reads the same .env, copied into the image).
      - "${FLOWERA_LAN_PORT:-8090}:${FLOWERA_LAN_PORT:-8090}"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Task records, chats, help requests, worker memory and action
      # screenshots (flowera.db). Without a volume, every rebuild of this
      # container would start the records from nothing.
      - flowera-data:/data

    environment:
      - FLOWERA_DATA_DIR=/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - flowera-network

    restart: unless-stopped

networks:
  flowera-network:
    name: flowera-network

volumes:
  flowera-data:
    name: flowera-data
