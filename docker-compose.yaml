services:
  desktop-manager:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: decurix

    # The settings, keys included, given to the container when it starts - never baked into the image. Optional, so
    # a checkout without a .env still starts (and says it found none).
    env_file:
      - path: .env
        required: false

    ports:
      # The primary listener has no login: it can create desktops and run
      # commands on the host. Published on loopback only, so nothing else on
      # the network can reach it (DECURIX_ADMIN_BIND=0.0.0.0 undoes that).
      # Desktops don't use this mapping - they call back over
      # decurix-network (DECURIX_CONTROL_PLANE_URL below).
      - "${DECURIX_ADMIN_BIND:-127.0.0.1}:8080:8080"
      # The LAN/tunnel-facing listener (internal/lanaccess) - gated by an
      # access code, unlike 8080 above. What a Cloudflare tunnel or a direct
      # LAN address should be pointed at. DECURIX_LAN_PORT in .env changes
      # the port on both sides at once (compose's own variable substitution
      # here; the binary reads the same .env, handed in by env_file below -
      # never copied into the image).
      # DECURIX_LAN_BIND picks the address it is published on. The Windows
      # app sets 127.0.0.1: its LAN link and tunnel come in through Windows'
      # own 127.0.0.1 (windows-lan.js), and a port published on every address
      # of the WSL distro let a desktop come back in through Docker's proxy,
      # from the gateway - indistinguishable from the person - and try codes.
      - "${DECURIX_LAN_BIND:-0.0.0.0}:${DECURIX_LAN_PORT:-8090}:${DECURIX_LAN_PORT:-8090}"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Task records, chats, help requests, worker memory and action
      # screenshots (decurix.db). Without a volume, every rebuild of this
      # container would start the records from nothing.
      - decurix-data:/data
      # Mount host Windows C: drive and Linux user home for host apps and session discovery
      - ${DECURIX_HOST_MNT_C:-/mnt/c}:/mnt/c:ro
      - ${DECURIX_HOST_HOME:-/home}:/host-home:ro
      - /tmp:/tmp

    environment:
      - DECURIX_DATA_DIR=/data
      - DECURIX_CONTROL_PLANE_URL=http://decurix:8080
      - DECURIX_HOST_MNT_C=/mnt/c
      - DECURIX_HOST_HOME=/host-home
      # "wsl" from the Windows app (main.js): desktops are made only while the WSL host's fence between them is in
      # place, read from /tmp/decurix-wsl/fence (desktop/electron/wsl/dockerd.sh). Empty elsewhere.
      - DECURIX_HOST_KIND=${DECURIX_HOST_KIND:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - decurix-network

    restart: unless-stopped

    # An update recreates this container: the control plane is sent SIGTERM and drains (requests in flight - a
    # desktop's model call - finish, new ones are asked to come back; DECURIX_SHUTDOWN_DRAIN, 90 s by default) before
    # it exits. Docker waits this long before it kills it, so the drain always ends first (docs/running.md).
    stop_grace_period: 100s

networks:
  # External on purpose: the scripts (lib/ollama-setup.*) and the control
  # plane itself (desktop.Manager.EnsureNetwork) create this network before
  # compose ever runs, and compose refuses to adopt a network it did not
  # create ("has incorrect label com.docker.compose.network"), which failed
  # every fresh install. Create it first when running compose by hand:
  #   docker network create decurix-network
  decurix-network:
    name: decurix-network
    external: true

volumes:
  decurix-data:
    name: decurix-data
