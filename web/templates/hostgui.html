<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{.Title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; }
  #stage { display: none; position: relative; width: fit-content; margin: 0 auto; line-height: 0; user-select: none; }
  #screen { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; outline: none; }
  /* The app's own controls, laid exactly over the picture: invisible to a person, but real buttons and fields to the
     VM's browser - what the desktop's agents read, what its approval gate judges, and what a recording names. They
     come from Windows' accessibility tree (or, for an app that has none, a vision model's reading of the picture). A
     click on one is a click on the app at that place. */
  #ax { position: absolute; inset: 0; overflow: hidden; }
  #ax > * { position: absolute; box-sizing: border-box; margin: 0; padding: 0; border: 0; background: transparent;
            color: transparent; caret-color: transparent; font-size: 10px; line-height: 1; overflow: hidden;
            white-space: nowrap; outline: none; appearance: none; -webkit-appearance: none; cursor: default; }
  #ax > .t { pointer-events: none; }
  #ax > input::placeholder { color: transparent; } /* a field's name, for the VM's browser to read; never drawn */
  #note { position: fixed; left: 8px; bottom: 6px; color: #9a9a9a; font: 11px/1.3 system-ui, sans-serif; max-width: 40%;
          background: rgba(27,27,27,.8); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
  #msg { color: #d8d8d8; font: 15px/1.5 system-ui, sans-serif; padding: 28px; max-width: 560px; }
  #msg.error { color: #ffb4a8; }
  #msg small { display: block; margin-top: 10px; color: #8a8a8a; }
  #msg .spin { display: inline-block; width: 14px; height: 14px; margin-right: 10px; vertical-align: -2px;
    border: 2px solid #555; border-top-color: #d8d8d8; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="msg" style="display:none"><span class="spin"></span>Starting {{.Title}} on the host&hellip;<small id="hint" style="display:none">The first start sets the app up on the host (your browser may have to start first), which can take a minute or two. Later starts are instant.</small></div>
<div id="stage">
  <canvas id="screen" tabindex="0" aria-hidden="true"></canvas>
  <div id="ax"></div>
</div>
<div id="note" hidden></div>
<script>
(function () {
  var ID = {{.ID}}, TOKEN = {{.Token}}, DESKTOP = {{.Desktop}}, TARGET = {{.Target}}, ARGS = {{.Args}};
  var msg = document.getElementById('msg'), img = document.getElementById('screen');
  var stage = document.getElementById('stage'), ax = document.getElementById('ax'), note = document.getElementById('note');
  // No alpha and no synchronisation with the page's own paint: the picture is opaque and only ever replaced, and this runs in
  // a desktop with little CPU to spare.
  var gfx = img.getContext('2d', { alpha: false, desynchronized: true });
  var live = false;

  function post(path, body) {
    body.id = ID; body.token = TOKEN;
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true });
  }
  function fail(text) {
    live = false; msg.className = 'error'; msg.textContent = text; msg.style.display = 'block'; stage.style.display = 'none'; note.hidden = true;
  }

  // The person closed the app from inside it: this window was only ever showing it, so it closes too, rather than asking
  // to be closed a second time. A window the browser will not let a page close says why it is empty instead.
  function appClosed() {
    live = false;
    try { window.close(); } catch (e) {}
    setTimeout(function () { fail('The app was closed. You can close this window.'); }, 400);
  }

  // Position in the app's own pixels: the picture is scaled to fit this window, so undo that scale.
  function pos(e) {
    var r = img.getBoundingClientRect();
    return { x: Math.round((e.clientX - r.left) * img.width / r.width), y: Math.round((e.clientY - r.top) * img.height / r.height) };
  }

  // ---- The connection. One WebSocket carries the picture down and the person's input up, both in order, so nothing is
  // requested and nothing overtakes anything: a typed word arrives as typed, and a picture is drawn when the host has one.
  var ws = null, closedByApp = false, retries = 0, seqOut = 0, answers = {};
  var outbox = [], pendingMove = null, moveFrame = 0;

  function wsURL() {
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/host-gui/ws?id=' + encodeURIComponent(ID) +
      '&token=' + encodeURIComponent(TOKEN) + '&desktop=' + encodeURIComponent(DESKTOP);
  }
  function flush() {
    if (!ws || ws.readyState !== 1) return;
    while (outbox.length) ws.send(outbox.shift());
  }
  // The field of this page the app's keyboard was last given to (aim), or null once anything else may have moved it.
  var appField = null;
  function emit(ev) {
    if (ev.kind === 'down' || ev.kind === 'key' || ev.kind === 'wheel' || ev.kind === 'choose' || ev.kind === 'press' || ev.kind === 'copy') { if (!ev.inField) appField = null; }
    // Only the latest of a run of mouse moves matters; anything else is sent after it, in order.
    if (ev.kind === 'move') {
      pendingMove = ev;
      if (!moveFrame) moveFrame = requestAnimationFrame(function () { moveFrame = 0; if (pendingMove) { outbox.push(JSON.stringify(pendingMove)); pendingMove = null; flush(); } });
      return;
    }
    if (pendingMove) { outbox.push(JSON.stringify(pendingMove)); pendingMove = null; }
    outbox.push(JSON.stringify(ev));
    flush();
    if (ev.kind !== 'controls') inputMade();
  }

  // ---- Drawing. A patch is decoded off the main thread and drawn where it belongs. Decodes finish in any order, so they are
  // chained to draw in the order they arrived; and a whole picture makes everything queued before it pointless, so under load
  // (a busy VM) the queue is dropped rather than worked through.
  var chain = Promise.resolve(), epoch = 0;
  function onPatch(buf) {
    var v = new DataView(buf), whole = v.getUint8(0) & 1;
    var W = v.getUint16(1), H = v.getUint16(3), x = v.getUint16(5), y = v.getUint16(7);
    var blob = new Blob([new Uint8Array(buf, 13)], { type: 'image/jpeg' });
    if (whole) epoch++;
    var mine = epoch;
    var decoded = createImageBitmap(blob);
    chain = chain.then(function () { return decoded; }).then(function (bmp) {
      if (mine !== epoch) { bmp.close(); return; } // a newer whole picture has been received since
      if (whole) {
        if (img.width !== W || img.height !== H) { img.width = W; img.height = H; }
      } else if (img.width !== W || img.height !== H) { bmp.close(); return; } // a patch of a picture that has since been resized
      gfx.drawImage(bmp, x, y);
      bmp.close();
    }).catch(function () {});
  }

  function connect() {
    ws = new WebSocket(wsURL());
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () { retries = 0; flush(); askControls(); };
    ws.onmessage = function (e) {
      if (typeof e.data !== 'string') { onPatch(e.data); return; }
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.closed) { closedByApp = true; appClosed(); return; }
      if (m.id && answers[m.id]) { var cb = answers[m.id]; delete answers[m.id]; cb(m); }
    };
    ws.onclose = function () {
      if (closedByApp || !live) return;
      // The connection dropped but the app is still running on the host: reconnect, and the host sends the whole picture again.
      if (retries++ > 8) { fail('Lost the connection to the Decurix control plane.'); return; }
      setTimeout(connect, Math.min(3000, 250 * retries));
    };
  }

  // ---- The app's controls ----
  // Asked for over the same connection, answered from the host's last read of them (which starts the next one). After an
  // input they are asked for often until a read made after it arrives; while that has not arrived the page carries
  // data-decurix-busy, which the desktop's agent waits out before it reads the page (computer/cdp.py), so its approval
  // gate judges the control that is on the screen now, not the one before the click.
  var hasControls = false, busyTimer = 0, lastInput = 0, asking = false, treeW = 0, treeH = 0, lastPointer = 0;

  function markBusy() {
    if (!hasControls) return;
    document.documentElement.setAttribute('data-decurix-busy', '');
    clearTimeout(busyTimer);
    busyTimer = setTimeout(clearBusy, 8000);
  }
  function clearBusy() { clearTimeout(busyTimer); document.documentElement.removeAttribute('data-decurix-busy'); }
  function inputMade() { lastInput = Date.now(); markBusy(); }

  function askControls() {
    if (asking || !ws || ws.readyState !== 1) return;
    asking = true;
    var id = ++seqOut;
    answers[id] = function (m) { asking = false; if (m.controls) showControls(m.controls); };
    outbox.push(JSON.stringify({ kind: 'controls', seq: id })); flush();
    setTimeout(function () { if (answers[id]) { delete answers[id]; asking = false; } }, 10000);
  }
  // Soon after input, every few seconds otherwise (an app also changes by itself).
  (function poll() {
    var since = Date.now() - lastInput;
    if (live) askControls();
    setTimeout(poll, document.documentElement.hasAttribute('data-decurix-busy') ? 400 : since < 10000 ? 1200 : 3000);
  })();

  var ROLE = { button: 'button', link: 'link', menuitem: 'menuitem', tab: 'tab', option: 'option', treeitem: 'treeitem',
               cell: 'gridcell', checkbox: 'checkbox', radio: 'radio', combobox: 'combobox', slider: 'slider',
               spinbutton: 'spinbutton', columnheader: 'columnheader', image: 'img' };

  function isField(t) { return !!t && t.parentNode === ax && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'); }

  function place(elem, n) {
    elem.style.left = (n.box[0] / treeW * 100) + '%';
    elem.style.top = (n.box[1] / treeH * 100) + '%';
    elem.style.width = (n.box[2] / treeW * 100) + '%';
    elem.style.height = (n.box[3] / treeH * 100) + '%';
    elem.dataset.box = JSON.stringify(n.box);
  }

  // What changes about a control between two reads.
  function update(elem, n) {
    place(elem, n);
    if (n.role === 'cell') {
      // A spreadsheet's cell: what it holds is in its name, beside its address ("D2 = 4950"), since a grid cell has no
      // value of its own to a reader of this page.
      var inner = elem.querySelector('[role=gridcell]');
      var label = (n.name || '') + (n.value ? ' = ' + n.value : '');
      // As its text too: a reader lists a row by the text of its cells.
      if (inner && inner.textContent !== label) { inner.textContent = label; inner.setAttribute('aria-label', label); }
    } else if (n.role === 'textbox') {
      var type = n.password ? 'password' : 'text';
      if (elem.tagName === 'INPUT' && elem.type !== type) elem.type = type;
      // What was typed a moment ago stays until the app's field has had time to show it.
      if (Date.now() - Number(elem.dataset.edited || 0) > 2000 && elem.value !== (n.value || '')) elem.value = n.value || '';
    } else if (n.role !== 'text' && n.role !== 'image') {
      // What a drop-down, a cell or a spin box shows is its text, as a page's would be.
      var shown = n.value || '';
      if (elem.textContent !== shown) elem.textContent = shown;
    }
    // A button that stays down (Bold, Italic, a view's toggle) says so as pressed: a button has no "checked" to a reader,
    // and without it a worker that could not see whether a header was bold pressed Bold again and undid it (found live).
    var toggle = n.checked !== undefined && n.checked !== null;
    var pressedKind = elem.getAttribute('role') === 'button';
    if (toggle && pressedKind) elem.setAttribute('aria-pressed', n.checked ? 'true' : 'false'); else elem.removeAttribute('aria-pressed');
    if (toggle && !pressedKind) elem.setAttribute('aria-checked', n.checked ? 'true' : 'false'); else elem.removeAttribute('aria-checked');
    if (n.expanded !== undefined && n.expanded !== null) elem.setAttribute('aria-expanded', n.expanded ? 'true' : 'false'); else elem.removeAttribute('aria-expanded');
    if (n.selected) elem.setAttribute('aria-selected', 'true'); else elem.removeAttribute('aria-selected');
    if (n.disabled) elem.setAttribute('aria-disabled', 'true'); else elem.removeAttribute('aria-disabled');
  }

  function build(n) {
    var elem;
    if (n.role === 'textbox') {
      // A field taller than a line or two (a document's page, a notes box) takes several lines: an <input> drops every
      // line break typed into it - found live (2026-10-15), a letter typed into real Word arrived as its first line.
      elem = document.createElement(!n.password && n.box && n.box[3] > 60 ? 'textarea' : 'input');
      elem.setAttribute('autocomplete', 'off');
      elem.tabIndex = -1;
      if (n.name) { elem.setAttribute('aria-label', n.name); elem.placeholder = n.name; }
    } else if (n.role === 'cell') {
      // A grid cell is a grid cell to the browser's accessibility tree only inside a grid's row; on its own it is dropped
      // (found live, 2026-10-16: 736 of Excel's cells were on this page and none reached the worker). Each is its own
      // one-cell grid, laid where the app draws it.
      elem = document.createElement('div');
      elem.setAttribute('role', 'grid');
      var row = document.createElement('div');
      row.setAttribute('role', 'row');
      row.style.cssText = 'position:absolute;inset:0';
      var cell = document.createElement('div');
      cell.setAttribute('role', 'gridcell');
      cell.style.cssText = 'position:absolute;inset:0';
      cell.tabIndex = -1;
      row.appendChild(cell);
      elem.appendChild(row);
    } else if (n.role === 'text') {
      elem = document.createElement('span');
      elem.className = 't';
      elem.textContent = n.name;
    } else {
      elem = document.createElement('div');
      elem.setAttribute('role', ROLE[n.role] || 'button');
      if (n.role === 'image' || n.role === 'columnheader') elem.className = 't'; else elem.tabIndex = -1;
      if (n.name) elem.setAttribute('aria-label', n.name);
    }
    update(elem, n);
    return elem;
  }

  function showControls(t) {
    if (t.pending && !(t.nodes || []).length) return; // nothing read yet: keep what is shown
    if (t.error) {
      hasControls = false; clearBusy(); ax.textContent = '';
      note.textContent = 'Picture only: ' + t.error; note.hidden = false;
      return;
    }
    treeW = t.w || img.width; treeH = t.h || img.height;
    if (!treeW || !treeH) return;
    var nodes = t.nodes || [];
    var usable = nodes.filter(function (n) { return n.role !== 'text' && n.role !== 'image' && n.role !== 'columnheader'; }).length;
    hasControls = usable > 0;
    if (t.source === 'vision') { note.textContent = 'Controls read from the picture by the vision model'; note.hidden = false; }
    else if (!hasControls) { note.textContent = 'Picture only: this app shows no controls the VM can read.'; note.hidden = false; }
    else note.hidden = true;

    // A control the app still shows keeps its element: an agent that has just read the page acts on the element it read
    // (a rebuilt one is a different node, and its click fails as "detached"), and the field someone is typing in keeps the
    // browser's focus. Same role and name is the same control; the Nth of several alike is matched to the Nth.
    var old = {};
    Array.prototype.forEach.call(ax.children, function (e) { old[e.dataset.key] = e; });
    var active = document.activeElement, counts = {};
    var frag = document.createDocumentFragment();
    nodes.forEach(function (n) {
      var base = n.role + '\u0001' + (n.name || '');
      counts[base] = (counts[base] || 0) + 1;
      var key = base + '\u0001' + counts[base];
      var elem = old[key];
      if (elem) { delete old[key]; update(elem, n); } else { elem = build(n); elem.dataset.key = key; }
      frag.appendChild(elem);
    });
    ax.textContent = '';
    ax.appendChild(frag);
    if (active && active.parentNode === ax && document.activeElement !== active) {
      refocusing = true;
      try { active.focus({ preventScroll: true }); } finally { refocusing = false; }
    }
    if (t.fresh) clearBusy();
  }

  // The middle of a control, in the app's pixels.
  function middleOf(elem) {
    var b = JSON.parse(elem.dataset.box), fx = img.width / (treeW || img.width), fy = img.height / (treeH || img.height);
    return { x: Math.round((b[0] + b[2] / 2) * fx), y: Math.round((b[1] + b[3] / 2) * fy) };
  }
  function clickAt(p) { emit({ kind: 'down', x: p.x, y: p.y, right: false, mods: '' }); emit({ kind: 'up', x: p.x, y: p.y, right: false, mods: '' }); }

  // Picks an entry of the app's drop-down list by its name, through the app's own accessibility (keys and clicks posted to
  // a Windows dialog do not move its focus). The worker's action layer calls it on a combobox element; the answer is
  // the entry's name, or "ERR ..." with why none was chosen.
  // Presses an app's named control through its accessibility (decurixChoose's sibling): the worker's action layer calls
  // it for a button, tab, menu entry, link or check box; "ERR ..." and the caller clicks as before.
  window.decurixPress = function (elem) {
    return new Promise(function (resolve) {
      if (!elem || !elem.dataset || !elem.dataset.box) { resolve('ERR not a control of the app'); return; }
      var p = middleOf(elem), id = ++seqOut, timer = setTimeout(function () { delete answers[id]; resolve('ERR the app did not answer'); }, 10000);
      answers[id] = function (r) { clearTimeout(timer); resolve((r && r.text) || 'ERR no answer'); };
      markBusy();
      emit({ kind: 'press', x: p.x, y: p.y, seq: id });
    });
  };
  // Puts a line of text into an app's field through its accessibility (the bridge sets the field's value and gives it
  // the keyboard), instead of typing it key by key: typed, the last keys could be overtaken by the next key sent. The
  // answer is "SET <what the field holds>" or "ERR ...", and the worker's action layer types instead on an error.
  window.decurixSetValue = function (elem, text, append) {
    return new Promise(function (resolve) {
      if (!isField(elem) || !elem.dataset.box) { resolve('ERR not a field of the app'); return; }
      var p = middleOf(elem), id = ++seqOut, timer = setTimeout(function () { delete answers[id]; resolve('ERR the app did not answer'); }, 10000);
      answers[id] = function (r) {
        clearTimeout(timer);
        var said = (r && r.text) || 'ERR no answer';
        if (said.indexOf('SET') === 0) {
          elem.value = said.slice(4);
          elem.dataset.edited = String(Date.now());
          appField = elem;
        }
        resolve(said);
      };
      markBusy();
      emit({ kind: 'setvalue', x: p.x, y: p.y, text: String(text || ''), append: !!append, seq: id });
    });
  };
  window.decurixChoose = function (elem, text) {
    return new Promise(function (resolve) {
      if (!elem || !elem.dataset || !elem.dataset.box) { resolve('ERR not a control of the app'); return; }
      var p = middleOf(elem), id = ++seqOut, timer = setTimeout(function () { delete answers[id]; resolve('ERR the app did not answer'); }, 20000);
      answers[id] = function (r) { clearTimeout(timer); resolve((r && r.text) || 'ERR no answer'); };
      markBusy();
      emit({ kind: 'choose', x: p.x, y: p.y, text: String(text || ''), seq: id });
    });
  };

  // A field focused without a pointer (an agent's DOM focus) is clicked in the app, so what is typed lands there. The click
  // alone does not move a Windows dialog's focus, so the app is also asked to give that field the keyboard; and since a key
  // (an Enter that moves on to the next cell, say) can take the app's focus elsewhere while this page's focus stays put,
  // text is aimed again whenever anything else happened in between. Found live (2026-10-15): the second reference typed
  // into Excel's Name Box went into a cell ("TotalD20").
  function aim(t) {
    if (appField === t) return;
    var m = middleOf(t);
    clickAt(m);
    emit({ kind: 'setfocus', x: m.x, y: m.y });
    appField = t;
  }
  var refocusing = false;
  ax.addEventListener('focusin', function (e) {
    if (isField(e.target) && !refocusing && Date.now() - lastPointer > 500) aim(e.target);
  });

  // Text typed into a field goes to the app as text. Replacing all of it selects it (Ctrl+A) and lets the new text replace
  // the selection; emptying it is Ctrl+A then Backspace. Never Delete: where the app's keyboard is not in the field after
  // all, Ctrl+A selects everything in a list and Delete deletes it - found live (2026-10-16), a folder of the person's
  // own computer went to the Recycle Bin from a file dialog's list.
  function selectField() { emit({ kind: 'key', vk: 65, mods: 'c', inField: true }); }
  function clearField() { selectField(); emit({ kind: 'key', vk: 8, mods: '', inField: true }); }
  ax.addEventListener('beforeinput', function (e) {
    var t = e.target;
    if (!isField(t)) return;
    aim(t);
    var whole = t.value.length > 0 && t.selectionStart === 0 && t.selectionEnd === t.value.length;
    var type = e.inputType || '';
    t.dataset.edited = String(Date.now());
    if (type.indexOf('insert') === 0 && type !== 'insertLineBreak' && type !== 'insertParagraph') {
      var data = e.data || (e.dataTransfer && e.dataTransfer.getData('text/plain')) || '';
      if (whole) selectField();
      // Line breaks travel with the text: the control plane gives the app each one the way that app takes it.
      if (data) emit({ kind: 'type', text: data });
    } else if (type === 'insertLineBreak' || type === 'insertParagraph') {
      emit({ kind: 'type', text: '\n' });
    } else if (type.indexOf('deleteContentBackward') === 0 || type.indexOf('deleteWordBackward') === 0) {
      if (whole) clearField(); else emit({ kind: 'key', vk: 8, mods: '', inField: true });
    } else if (type.indexOf('delete') === 0) {
      if (whole) clearField(); else emit({ kind: 'key', vk: 46, mods: '', inField: true });
    }
  });

  // Enter, Tab or Escape in a field moves the app's keyboard on (to the next cell, the next field, out of an editor), so
  // this page's focus leaves the field too: what is typed next with no field named goes where the app's cursor now is.
  // Found live (2026-10-15): after Enter in Excel's Name Box, "Total" typed into the cell went into the Name Box again.
  function leaveField(t) {
    if (!isField(t)) return;
    refocusing = true;
    try { t.blur(); img.focus({ preventScroll: true }); } finally { refocusing = false; }
  }

  // The VM's clipboard, set from a hidden text box: navigator.clipboard needs a secure origin and this page is plain http.
  function setLocalClipboard(text) {
    var box = document.createElement('textarea');
    box.value = text; box.style.cssText = 'position:fixed;left:-1000px;top:0;opacity:0';
    document.body.appendChild(box); box.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(box); img.focus();
  }

  // Which of Ctrl, Shift and Alt are held: the letters c, s, a the host expects.
  function mods(e) { return (e.ctrlKey ? 'c' : '') + (e.shiftKey ? 's' : '') + (e.altKey ? 'a' : ''); }

  // The whole picture, controls included, is the app: a press on a control is a press on the app at that place. A field
  // keeps the browser's focus (typing goes through it); anything else hands it to the picture.
  var down = false;
  stage.addEventListener('mousedown', function (e) {
    lastPointer = Date.now();
    if (!isField(e.target)) { e.preventDefault(); img.focus(); }
    down = true;
    var p = pos(e); emit({ kind: 'down', x: p.x, y: p.y, right: e.button === 2, mods: mods(e) });
  });
  window.addEventListener('mouseup', function (e) {
    if (!down) return; down = false; lastPointer = Date.now();
    var p = pos(e); emit({ kind: 'up', x: p.x, y: p.y, right: e.button === 2, mods: mods(e) });
    // A press posted to the app does not move a dialog's or a toolbar box's focus: the app is asked to focus the field too.
    if (isField(e.target)) { var mf = middleOf(e.target); emit({ kind: 'setfocus', x: mf.x, y: mf.y }); appField = e.target; }
  });
  stage.addEventListener('mousemove', function (e) { if (down) { var p = pos(e); emit({ kind: 'move', x: p.x, y: p.y, right: e.buttons === 2, mods: mods(e) }); } });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var p = pos(e); emit({ kind: 'wheel', x: p.x, y: p.y, delta: e.deltaY > 0 ? -1 : 1 });
  }, { passive: false });

  // A key that is not simply a character (Enter, arrows, F-keys) or that is held with Ctrl or Alt (a shortcut) is sent as a
  // virtual-key code with its modifiers; the browser's keyCode is the Windows virtual-key code. A plain character, or one
  // typed with Shift or AltGr (which a keyboard reports as Ctrl+Alt), is sent as the text it produces. In a field, text and
  // deleting come through beforeinput instead.
  var NAMED = { Backspace: 1, Tab: 1, Enter: 1, Escape: 1, PageUp: 1, PageDown: 1, End: 1, Home: 1, ArrowLeft: 1, ArrowUp: 1, ArrowRight: 1, ArrowDown: 1, Insert: 1, Delete: 1 };
  window.addEventListener('keydown', function (e) {
    if (!live) return;
    if (e.key === 'Control' || e.key === 'Shift' || e.key === 'Alt' || e.key === 'Meta' || e.key === 'CapsLock' || e.isComposing) return;
    var text = e.key.length === 1;
    var altGr = e.ctrlKey && e.altKey && text; // AltGr on many layouts
    var shortcut = (e.ctrlKey || e.altKey) && !altGr;
    var k = e.key.toLowerCase();
    var inField = isField(e.target);
    // Copy and cut are done in the app, then what it copied is brought back into this desktop's clipboard. Paste is the
    // browser's own paste event (below), typed into the app: the host's clipboard is the person's, and never goes in.
    if (e.ctrlKey && !e.altKey && !e.shiftKey && (k === 'c' || k === 'x')) {
      e.preventDefault();
      var id = ++seqOut;
      answers[id] = function (r) { if (r && r.text) setLocalClipboard(r.text); };
      emit({ kind: 'copy', vk: k === 'c' ? 67 : 88, seq: id });
      return;
    }
    if ((e.ctrlKey && !e.altKey && k === 'v') || (e.shiftKey && e.key === 'Insert')) return; // handled by the paste event
    // A single-line field gives no input event for Enter: it is the Enter key, sent from here.
    if (inField && e.key === 'Enter' && !shortcut && e.target.tagName === 'INPUT') {
      e.preventDefault(); emit({ kind: 'key', vk: 13, mods: mods(e) }); leaveField(e.target); return;
    }
    if (inField && !shortcut && (text || e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Enter')) return; // beforeinput
    if (NAMED[e.key] || /^F([1-9]|1[0-2])$/.test(e.key) || (shortcut && e.keyCode > 0)) {
      e.preventDefault(); emit({ kind: 'key', vk: e.keyCode, mods: mods(e) });
      if (inField && (e.key === 'Tab' || e.key === 'Escape')) leaveField(e.target);
      return;
    }
    if (text && !e.metaKey) { e.preventDefault(); emit({ kind: 'type', text: e.key }); }
  });

  window.addEventListener('paste', function (e) {
    if (!live) return;
    if (isField(document.activeElement)) return; // the field's beforeinput sends it
    var text = e.clipboardData ? e.clipboardData.getData('text') : '';
    e.preventDefault();
    if (text) emit({ kind: 'paste', text: text });
  });

  // Closing this window closes the app on the host: it has no window of its own to close.
  window.addEventListener('pagehide', function () { if (live) navigator.sendBeacon('/api/host-gui/stop', new Blob([JSON.stringify({ id: ID, token: TOKEN })], { type: 'application/json' })); });

  // The app is normally already running on the host (it is kept ready), so this answers at once; only a start that is
  // really waiting for the app says so.
  var slow = setTimeout(function () { msg.style.display = 'block'; }, 700);
  var slower = setTimeout(function () { var h = document.getElementById('hint'); if (h) h.style.display = 'block'; }, 6000);
  post('/api/host-gui/start', { target: TARGET, args: ARGS }).then(function (r) {
    return r.json().then(function (j) { return { ok: r.ok, body: j }; });
  }).then(function (res) {
    clearTimeout(slow); clearTimeout(slower);
    if (!res.ok) { fail(res.body && res.body.error ? res.body.error : 'Could not start the app.'); return; }
    live = true; msg.style.display = 'none';
    stage.style.display = 'block';
    img.width = res.body.w || img.width; img.height = res.body.h || img.height;
    img.focus();
    connect();
    // Fit the window to the app, as far as the browser lets an app window be resized.
    try { window.resizeTo(res.body.w + (window.outerWidth - window.innerWidth), res.body.h + (window.outerHeight - window.innerHeight)); } catch (e) {}
  }).catch(function () { clearTimeout(slow); clearTimeout(slower); fail('Could not reach the Decurix control plane.'); });
})();
</script>
</body>
</html>
