<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{.Name}} - screen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #141414; overflow: hidden; color: #d8d8d8; font: 14px/1.5 system-ui, sans-serif; }
  #bar { height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #1f1f1f; border-bottom: 1px solid #2c2c2c; }
  #bar .name { font-weight: 600; }
  #bar .dot { width: 9px; height: 9px; border-radius: 50%; background: #777; }
  #bar .dot.on { background: #4fbd8b; }
  #bar .dot.off { background: #c9a227; }
  #bar a { color: #9fd9bd; text-decoration: none; }
  #bar .note { margin-left: auto; color: #8a8a8a; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #open { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #open input { width: 230px; min-width: 90px; height: 24px; padding: 0 8px; background: #141414; color: inherit; border: 1px solid #3a3a3a; border-radius: 6px; font: inherit; font-size: 13px; }
  #open input:focus { outline: none; border-color: #4fbd8b; }
  #open button { height: 26px; padding: 0 10px; background: #2c2c2c; color: inherit; border: 1px solid #3a3a3a; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  #open button:disabled { opacity: .5; cursor: default; }
  #open-said { font-size: 12px; color: #c9a227; max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #open-said.ok { color: #8a8a8a; }
  #stage { height: calc(100% - 35px); display: flex; align-items: center; justify-content: center; }
  #screen { display: none; max-width: 100%; max-height: 100%; user-select: none; outline: none; }
  #msg { padding: 28px; max-width: 520px; text-align: center; }
  #msg button { margin-top: 16px; padding: 9px 18px; background: #a7f3d0; color: #052e21; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="bar">
  <span id="dot" class="dot"></span><span class="name">{{.Name}}</span>
  <a href="/view/{{.ID}}">Chat</a>
  <!-- This desktop has no Start menu or icons: this is how something is put on it. -->
  <form id="open" autocomplete="off">
    <input id="open-what" list="open-apps" placeholder="Open an app, file or web address" aria-label="Open an app, a file or a web address on this screen">
    <datalist id="open-apps">
      <option value="notepad"><option value="excel"><option value="word"><option value="powerpoint"><option value="paint">
      <option value="character map"><option value="https://">
    </datalist>
    <button type="submit">Open</button>
    <span id="open-said" role="status"></span>
  </form>
  <span class="note">This worker's own desktop, not your screen.</span>
</div>
{{.Controls}}
<div id="stage">
  <div id="msg">Connecting to the worker's screen&hellip;</div>
  <canvas id="screen" tabindex="0"></canvas>
</div>
<script>
(function () {
  var ID = {{.ID}};
  var msg = document.getElementById('msg'), img = document.getElementById('screen'), dot = document.getElementById('dot');
  // No alpha and no synchronisation with the page's own paint: the picture is opaque and only ever replaced.
  var gfx = img.getContext('2d', { alpha: false, desynchronized: true });
  var live = false, ws = null, retries = 0, seqOut = 0, answers = {};
  var outbox = [], pendingMove = null, moveFrame = 0;

  function say(text, button, action) {
    live = false;
    img.style.display = 'none'; msg.style.display = 'block';
    msg.textContent = text;
    if (button) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = button;
      b.addEventListener('click', action);
      msg.appendChild(document.createElement('br')); msg.appendChild(b);
    }
  }

  // Position in the desktop's own pixels: the picture is scaled to fit this window, so undo that scale.
  function pos(e) {
    var r = img.getBoundingClientRect();
    return { x: Math.round((e.clientX - r.left) * img.width / r.width), y: Math.round((e.clientY - r.top) * img.height / r.height) };
  }

  function flush() {
    if (!ws || ws.readyState !== 1) return;
    while (outbox.length) ws.send(outbox.shift());
  }
  function emit(ev) {
    // Only the latest of a run of mouse moves matters; anything else is sent after it, in order.
    if (ev.kind === 'move') {
      pendingMove = ev;
      if (!moveFrame) moveFrame = requestAnimationFrame(function () { moveFrame = 0; if (pendingMove) { outbox.push(JSON.stringify(pendingMove)); pendingMove = null; flush(); } });
      return;
    }
    if (pendingMove) { outbox.push(JSON.stringify(pendingMove)); pendingMove = null; }
    outbox.push(JSON.stringify(ev));
    flush();
  }

  // A patch is decoded off the main thread and drawn where it belongs. Decodes finish in any order, so they are chained
  // to draw in the order they arrived; a whole picture makes everything queued before it pointless.
  var chain = Promise.resolve(), epoch = 0;
  function onPatch(buf) {
    var v = new DataView(buf), whole = v.getUint8(0) & 1;
    var W = v.getUint16(1), H = v.getUint16(3), x = v.getUint16(5), y = v.getUint16(7);
    var blob = new Blob([new Uint8Array(buf, 13)], { type: 'image/jpeg' });
    if (whole) epoch++;
    var mine = epoch;
    var decoded = createImageBitmap(blob);
    chain = chain.then(function () { return decoded; }).then(function (bmp) {
      if (mine !== epoch) { bmp.close(); return; }
      if (whole) {
        if (img.width !== W || img.height !== H) { img.width = W; img.height = H; }
        if (!live) { live = true; msg.style.display = 'none'; img.style.display = 'block'; img.focus(); dot.className = 'dot on'; }
      } else if (img.width !== W || img.height !== H) { bmp.close(); return; }
      gfx.drawImage(bmp, x, y);
      bmp.close();
    }).catch(function () {});
  }

  function start() {
    say('Starting the worker…');
    fetch('/api/desktops/start', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'id=' + encodeURIComponent(ID) })
      .then(function (r) { if (!r.ok) throw new Error(); retries = 0; setTimeout(connect, 1500); })
      .catch(function () { say('The worker could not be started.', 'Try again', start); });
  }

  // The worker's state decides what a dropped connection means: stopped offers Start, anything else is tried again.
  function dropped() {
    dot.className = 'dot off';
    fetch('/api/desktops/status?id=' + encodeURIComponent(ID)).then(function (r) { return r.json(); }).then(function (s) {
      if (s && s.status === 'stopped') { say('This worker is stopped.', 'Start it', start); return; }
      if (retries++ > 20) { say('The connection to this worker’s screen was lost.', 'Try again', function () { retries = 0; connect(); }); return; }
      if (!live) say(s && s.status === 'provisioning' ? (s.message || 'The worker is being created…') : 'Connecting to the worker’s screen…');
      setTimeout(connect, Math.min(3000, 400 * retries));
    }).catch(function () {
      if (retries++ > 20) { say('The Decurix control plane is not answering.', 'Try again', function () { retries = 0; connect(); }); return; }
      setTimeout(connect, 2000);
    });
  }

  function connect() {
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/desktop/' + encodeURIComponent(ID) + '/screen';
    var opened = false;
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () { opened = true; retries = 0; flush(); };
    ws.onmessage = function (e) {
      if (typeof e.data !== 'string') { onPatch(e.data); return; }
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.id && answers[m.id]) { var cb = answers[m.id]; delete answers[m.id]; cb(m); }
    };
    ws.onclose = function () { live = live && opened; dropped(); };
  }

  // This computer's clipboard, set from a hidden text box: navigator.clipboard needs a secure origin.
  function setLocalClipboard(text) {
    var box = document.createElement('textarea');
    box.value = text; box.style.cssText = 'position:fixed;left:-1000px;top:0;opacity:0';
    document.body.appendChild(box); box.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(box); img.focus();
  }

  // Which of Ctrl, Shift and Alt are held: the letters c, s, a the worker's desktop expects.
  function mods(e) { return (e.ctrlKey ? 'c' : '') + (e.shiftKey ? 's' : '') + (e.altKey ? 'a' : ''); }

  var down = false;
  img.addEventListener('mousedown', function (e) {
    e.preventDefault(); img.focus(); down = true;
    var p = pos(e); emit({ kind: 'down', x: p.x, y: p.y, right: e.button === 2, mods: mods(e) });
  });
  window.addEventListener('mouseup', function (e) {
    if (!down) return; down = false;
    var p = pos(e); emit({ kind: 'up', x: p.x, y: p.y, right: e.button === 2, mods: mods(e) });
  });
  img.addEventListener('mousemove', function (e) { var p = pos(e); emit({ kind: 'move', x: p.x, y: p.y, right: e.buttons === 2, mods: mods(e) }); });
  img.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  img.addEventListener('wheel', function (e) {
    e.preventDefault();
    var p = pos(e); emit({ kind: 'wheel', x: p.x, y: p.y, delta: e.deltaY > 0 ? -1 : 1 });
  }, { passive: false });

  // A key that is not simply a character (Enter, arrows, F-keys) or that is held with Ctrl or Alt (a shortcut) is sent as a
  // virtual-key code with its modifiers; the browser's keyCode is the Windows virtual-key code. A plain character is sent
  // as the text it produces.
  var NAMED = { Backspace: 1, Tab: 1, Enter: 1, Escape: 1, PageUp: 1, PageDown: 1, End: 1, Home: 1, ArrowLeft: 1, ArrowUp: 1, ArrowRight: 1, ArrowDown: 1, Insert: 1, Delete: 1 };
  window.addEventListener('keydown', function (e) {
    if (!live || document.activeElement !== img) return;
    if (e.key === 'Control' || e.key === 'Shift' || e.key === 'Alt' || e.key === 'Meta' || e.key === 'CapsLock' || e.isComposing) return;
    var text = e.key.length === 1;
    var altGr = e.ctrlKey && e.altKey && text;
    var shortcut = (e.ctrlKey || e.altKey) && !altGr;
    var k = e.key.toLowerCase();
    // Copy and cut are done on the worker's desktop, then what was copied is brought to this computer's clipboard.
    if (e.ctrlKey && !e.altKey && !e.shiftKey && (k === 'c' || k === 'x')) {
      e.preventDefault();
      var id = ++seqOut;
      answers[id] = function (r) { if (r && r.text) setLocalClipboard(r.text); };
      emit({ kind: 'copy', vk: k === 'c' ? 67 : 88, seq: id });
      return;
    }
    if ((e.ctrlKey && !e.altKey && k === 'v') || (e.shiftKey && e.key === 'Insert')) return; // the paste event below
    if (NAMED[e.key] || /^F([1-9]|1[0-2])$/.test(e.key) || (shortcut && e.keyCode > 0)) {
      e.preventDefault(); emit({ kind: 'key', vk: e.keyCode, mods: mods(e) }); return;
    }
    if (text && !e.metaKey) { e.preventDefault(); emit({ kind: 'type', text: e.key }); }
  });

  window.addEventListener('paste', function (e) {
    if (!live) return;
    var text = e.clipboardData ? e.clipboardData.getData('text') : '';
    e.preventDefault();
    if (text) emit({ kind: 'paste', text: text });
  });

  // Opening something on the worker's screen. The answer is the worker's own sentence ("Opened "Untitled - Notepad".")
  // or why it could not; while a demonstration is being recorded this is one of its steps.
  var openForm = document.getElementById('open'), openWhat = document.getElementById('open-what');
  var openSaid = document.getElementById('open-said'), openButton = openForm.querySelector('button');
  openForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var target = openWhat.value.trim();
    if (!target || openButton.disabled) return;
    openButton.disabled = true; openSaid.className = 'ok'; openSaid.textContent = 'Opening…'; openSaid.title = '';
    fetch('/api/desktops/open', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'id=' + encodeURIComponent(ID) + '&target=' + encodeURIComponent(target) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (r) {
        var text = r.ok ? (r.d.summary || 'Opened.') : (r.d.error || r.d.reason || 'That could not be opened.');
        openSaid.className = r.ok ? 'ok' : ''; openSaid.textContent = text; openSaid.title = text;
        if (r.ok) { openWhat.value = ''; img.focus(); }
      })
      .catch(function () { openSaid.className = ''; openSaid.textContent = 'The worker did not answer.'; })
      .then(function () { openButton.disabled = false; });
  });

  connect();
})();
</script>
</body>
</html>
