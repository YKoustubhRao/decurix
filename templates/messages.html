<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages · Flowera Workspaces</title>
<style>
*{box-sizing:border-box}:root{--bg:#f6f7f9;--surface:#fff;--border:#e7e9ed;--text:#17191c;--muted:#6b7280;--accent:#635bff;--shadow:0 8px 30px rgba(16,24,40,.06)}
body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{height:68px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-weight:700}.logo{width:30px;height:30px;border-radius:9px;background:#17191c;color:#fff;display:grid;place-items:center}.brand span{font-size:16px}nav{display:flex;gap:4px;margin-left:auto}nav a{color:var(--muted);text-decoration:none;padding:8px 11px;border-radius:8px;font-weight:500}nav a:hover,nav a.active{background:#f0f1f4;color:var(--text)}
.container{max-width:820px;margin:auto;padding:42px 22px 70px}.eyebrow{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}h1{font-size:30px;letter-spacing:-.035em;margin:0 0 7px}.sub{margin:0;color:var(--muted);margin-bottom:28px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:23px;box-shadow:var(--shadow)}
.field{margin-bottom:21px}label{display:block;font-weight:700;font-size:12px;margin-bottom:8px}select{width:100%;padding:11px 12px;border:1px solid #dfe2e7;border-radius:10px;background:#fff;color:var(--text);outline:0}select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,91,255,.1)}
.hint{margin-top:8px;color:var(--muted);font-size:11px}.hint strong{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#525866}
textarea{width:100%;min-height:300px;resize:vertical;border:1px solid #dfe2e7;border-radius:11px;padding:13px;outline:0;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,91,255,.1)}textarea::placeholder{color:#9aa0aa}
.footer{display:flex;align-items:center;gap:12px}.send{background:#635bff;color:#fff;border-radius:10px;padding:11px 17px;font-weight:600}.send:hover{background:#5148e5}.send:disabled{opacity:.6}.status{font-size:12px}.success{color:#16803c}.error{color:#b42318}
@media(max-width:650px){header{padding:0 16px}.brand span{display:none}.container{padding:28px 14px 50px}.card{padding:18px}nav a{font-size:12px;padding:7px 8px}.footer{display:block}.send{width:100%}.status{margin-top:10px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">✿</div><span>Flowera Workspaces</span></div><nav><a href="/">Desktops</a><a href="/dashboard">Help</a><a class="active" href="/messages">Messages</a></nav></header>
<main class="container">
<div class="eyebrow">Communication</div><h1>Send a message</h1><p class="sub">Send text directly into a Flowera desktop.</p>
<section class="card">
<div class="field"><label for="desktop">DESTINATION</label><select id="desktop">{{range .Desktops}}<option value="{{.ID}}">{{.Name}} · {{.Status}}</option>{{end}}</select><div class="hint">The message is saved inside the VM as <strong>DDMMYYYYHHMMSS.txt</strong>.</div></div>
<div class="field"><label for="content">MESSAGE</label><textarea id="content" placeholder="Write your message here…" onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter')sendMessage()"></textarea></div>
<div class="footer"><button id="sendButton" class="send" onclick="sendMessage()">Send to desktop</button><div id="success" class="status success" style="display:none">Message sent.</div><div id="error" class="status error" style="display:none"></div></div>
</section>
</main>
<script>
async function sendMessage(){const desktop=document.getElementById("desktop").value,content=document.getElementById("content").value,success=document.getElementById("success"),error=document.getElementById("error"),button=document.getElementById("sendButton");success.style.display="none";error.style.display="none";if(!desktop)return showError("Select a desktop.");if(!content.trim())return showError("Write a message first.");const f=new URLSearchParams();f.append("id",desktop);f.append("content",content);button.disabled=true;button.innerText="Sending…";try{const r=await fetch("/api/desktops/send",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:f}),d=await r.json();if(!r.ok)throw new Error(d.error||"Failed to send message");document.getElementById("content").value="";success.style.display="block";document.getElementById("content").focus()}catch(e){showError(e.message)}finally{button.disabled=false;button.innerText="Send to desktop"}}
function showError(text){const e=document.getElementById("error");e.innerText=text;e.style.display="block"}
</script>
</body></html>
