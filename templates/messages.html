<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages · Flowera Workspaces</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#070b15;
  --bg-2:#0f172a;
  --surface:rgba(15,23,42,.82);
  --surface-strong:#111b2e;
  --surface-soft:rgba(17,27,46,.72);
  --border:rgba(148,163,184,.18);
  --text:#e6edf9;
  --muted:#9aa8bd;
  --accent:#7c6cff;
  --accent-2:#3dd9ff;
  --red:#ff6b7d;
  --shadow:0 20px 50px rgba(13,17,30,.55)
}
body{margin:0;background:radial-gradient(circle at top left, rgba(124,108,255,.22), transparent 28%),radial-gradient(circle at top right, rgba(61,217,255,.14), transparent 26%),linear-gradient(135deg, #070b15 0%, #0b1220 40%, #0f172a 100%);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{height:74px;background:rgba(8,12,20,.7);backdrop-filter:blur(18px);border-bottom:1px solid rgba(148,163,184,.14);display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{width:32px;height:32px;border-radius:12px;background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px rgba(124,108,255,.35)}.brand span{font-size:16px}nav{display:flex;gap:8px;margin-left:auto}nav a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600}nav a:hover,nav a.active{background:rgba(124,108,255,.12);color:#e8e3ff}
.container{max-width:820px;margin:auto;padding:42px 22px 70px}.eyebrow{font-size:12px;color:#b9b5ff;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}h1{font-size:34px;letter-spacing:-.04em;margin:0 0 8px;line-height:1.1;text-shadow:0 0 24px rgba(124,108,255,.28)}.sub{margin:0;color:var(--muted);margin-bottom:28px}.card{background:linear-gradient(180deg, rgba(15,23,42,.92), rgba(13,20,34,.92));border:1px solid rgba(148,163,184,.16);border-radius:20px;padding:23px;box-shadow:var(--shadow)}
.field{margin-bottom:21px}label{display:block;font-weight:800;font-size:12px;margin-bottom:8px;letter-spacing:.08em;color:#cdd8ee}select{width:100%;padding:11px 12px;border:1px solid rgba(148,163,184,.22);border-radius:10px;background:rgba(12,18,29,.9);color:var(--text);outline:0}select:focus{border-color:rgba(124,108,255,.8);box-shadow:0 0 0 3px rgba(124,108,255,.12)}
.hint{margin-top:8px;color:var(--muted);font-size:11px}.hint strong{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#dfeaff}
textarea{width:100%;min-height:300px;resize:vertical;border:1px solid rgba(148,163,184,.22);border-radius:11px;padding:13px;outline:0;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);background:rgba(12,18,29,.9)}textarea:focus{border-color:rgba(124,108,255,.8);box-shadow:0 0 0 3px rgba(124,108,255,.12)}textarea::placeholder{color:#9aa0aa}
.footer{display:flex;align-items:center;gap:12px}.send{background:linear-gradient(135deg, var(--accent), #9a7dff);color:#fff;border-radius:10px;padding:11px 17px;font-weight:700;box-shadow:0 14px 28px rgba(124,108,255,.28)}.send:hover{background:linear-gradient(135deg, #6a5ff4, #8e7dff)}.send:disabled{opacity:.6}.status{font-size:12px}.success{color:#8cf3d1}.error{color:var(--red)}
@media(max-width:650px){header{padding:0 16px}.brand span{display:none}.container{padding:28px 14px 50px}.card{padding:18px}nav a{font-size:12px;padding:7px 8px}.footer{display:block}.send{width:100%}.status{margin-top:10px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">✿</div><span>Flowera Workspaces</span></div><nav><a href="/">Desktops</a><a href="/dashboard">Help</a><a class="active" href="/messages">Messages</a></nav></header>
<main class="container">
<div class="eyebrow">Communication</div><h1>Send a message</h1><p class="sub">Send text directly into a Flowera desktop.</p>
<section class="card">
<div class="field"><label for="desktop">DESTINATION</label><select id="desktop">{{range .Desktops}}<option value="{{.ID}}">{{.Name}} · {{.Status}}</option>{{end}}</select><div class="hint">The message is saved inside the VM as <strong>DDMMYYYYHHMMSS.txt</strong>.</div></div>
<div class="field"><label for="content">MESSAGE</label><textarea id="content" placeholder="Write your message here…" onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter')sendMessage()"></textarea></div>
<div class="footer"><button id="sendButton" class="send" onclick="sendMessage()">Send to desktop</button><div id="success" class="status success" style="display:none">Message sent.</div><div id="error" class="status error" style="display:none"></div></div>
</section>
</main>
<script>
async function sendMessage(){const desktop=document.getElementById("desktop").value,content=document.getElementById("content").value,success=document.getElementById("success"),error=document.getElementById("error"),button=document.getElementById("sendButton");success.style.display="none";error.style.display="none";if(!desktop)return showError("Select a desktop.");if(!content.trim())return showError("Write a message first.");const f=new URLSearchParams();f.append("id",desktop);f.append("content",content);button.disabled=true;button.innerText="Sending…";try{const r=await fetch("/api/desktops/send",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:f}),d=await r.json();if(!r.ok)throw new Error(d.error||"Failed to send message");document.getElementById("content").value="";success.style.display="block";document.getElementById("content").focus()}catch(e){showError(e.message)}finally{button.disabled=false;button.innerText="Send to desktop"}}
function showError(text){const e=document.getElementById("error");e.innerText=text;e.style.display="block"}
</script>
</body></html>
