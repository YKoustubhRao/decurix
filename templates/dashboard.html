<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Helptext Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f5f7fb;
            color: #17191c;
        }

        header {
            background: white;

            border-bottom:
                1px solid #e5e7eb;

            padding: 18px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;

            font-size: 21px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        button {
            border: 0;

            border-radius: 8px;

            padding: 10px 15px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 500;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary {
            background: #f3f4f6;
            color: #111827;
        }

        .secondary:hover {
            background: #e5e7eb;
        }

        .primary {
            background: #111827;
            color: white;
        }

        .primary:hover {
            background: #000;
        }

        .container {
            max-width: 900px;

            margin: 30px auto;

            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h2 {
            margin: 0 0 6px 0;

            font-size: 24px;
        }

        .page-header p {
            margin: 0;

            color: #6b7280;

            font-size: 14px;
        }

        .feed {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }

        .post {
            background: #fff8a6;

            border:
                1px solid #eadf73;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, 0.07);
        }

        .post-header {
            display: flex;

            align-items: flex-start;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 15px;
        }

        .post-vm {
            font-size: 16px;

            font-weight: 700;
        }

        .post-file {
            margin-top: 4px;

            color: #666;

            font-family: monospace;

            font-size: 12px;
        }

        .post-time {
            margin-top: 3px;

            color: #777;

            font-size: 12px;
        }

        .close {
            width: 30px;
            height: 30px;

            padding: 0;

            flex-shrink: 0;

            background: transparent;

            color: #555;

            font-size: 21px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .close:hover {
            background:
                rgba(0, 0, 0, 0.08);
        }

        /*
         * IMPORTANT:
         * The content is explicitly rendered with
         * white-space: pre-wrap so newlines and the
         * complete helptext remain visible.
         */

        .post-content {
            display: block;

            width: 100%;

            margin-bottom: 18px;

            padding: 14px;

            background:
                rgba(255, 255, 255, 0.45);

            border:
                1px solid rgba(0, 0, 0, 0.08);

            border-radius: 8px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            word-break: break-word;

            font-family: monospace;

            font-size: 14px;

            line-height: 1.6;

            color: #292929;
        }

        .reply {
            display: flex;

            gap: 8px;
        }

        .reply-input {
            flex: 1;

            min-width: 0;

            padding: 11px 13px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            background: white;

            font-size: 14px;

            outline: none;
        }

        .reply-input:focus {
            border-color: #9ca3af;
        }

        .send {
            background: #111827;

            color: white;

            white-space: nowrap;
        }

        .send:hover {
            background: #000;
        }

        .reply-status {
            margin-top: 8px;

            font-size: 12px;

            display: none;
        }

        .reply-success {
            color: #15803d;
        }

        .reply-error {
            color: #b91c1c;
        }

        .empty {
            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 12px;

            padding: 70px 20px;

            text-align: center;

            color: #6b7280;
        }

        .empty h2 {
            color: #17191c;

            margin-bottom: 8px;
        }

        @media (max-width: 600px) {

            header {
                padding: 15px 18px;
            }

            header h1 {
                font-size: 18px;
            }

            .container {
                margin-top: 20px;

                padding: 0 14px;
            }

            .post {
                padding: 16px;
            }

            .reply {
                flex-direction: column;
            }

            .send {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<header>

    <h1>Helptext Dashboard</h1>

    <div class="header-actions">

        <button
            class="secondary"
            onclick="location.href='/'">
            ← Desktops
        </button>

        <button
            class="secondary"
            onclick="location.href='/messages'">
            Messages
        </button>

    </div>

</header>

<div class="container">

    <div class="page-header">

        <h2>Help Requests</h2>

        <p>
            Help requests from your desktops,
            newest first.
        </p>

    </div>

    <div
        id="feed"
        class="feed">

        {{if .Notes}}

            {{range .Notes}}

            <div
                class="post"
                id="post-{{.ID}}">

                <div class="post-header">

                    <div>

                        <div class="post-vm">
                            {{.VMName}}
                        </div>

                        <div class="post-file">
                            {{.Filename}}
                        </div>

                        <div class="post-time">
                            {{.CreatedAt.Format "02 Jan 2006, 15:04:05"}}
                        </div>

                    </div>

                    <button
                        class="close"
                        title="Close"
                        onclick="closePost('{{.ID}}')">
                        ×
                    </button>

                </div>

                <!-- HELP TEXT CONTENT -->

                <div class="post-content">{{.Content}}</div>

                <!-- REPLY BOX -->

                <div class="reply">

                    <input
                        class="reply-input"
                        id="reply-{{.ID}}"
                        placeholder="Reply to {{.VMName}}..."
                        autocomplete="off"
                        onkeydown="handleReplyKey(event, '{{.ID}}', '{{.DesktopID}}')"
                    >

                    <button
                        class="send"
                        id="send-{{.ID}}"
                        onclick="sendReply('{{.ID}}', '{{.DesktopID}}')">
                        Send
                    </button>

                </div>

                <div
                    class="reply-status"
                    id="status-{{.ID}}">
                </div>

            </div>

            {{end}}

        {{else}}

            <div class="empty">

                <h2>No help requests</h2>

                <p>
                    Helptext files created by desktops
                    will appear here.
                </p>

            </div>

        {{end}}

    </div>

</div>

<script>

async function closePost(id) {

    try {

        const form =
            new URLSearchParams();

        form.append(
            "id",
            id
        );

        const response =
            await fetch(
                "/api/helpnotes/close",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: form
                }
            );

        if (!response.ok) {

            const data =
                await response.json()
                    .catch(() => ({}));

            throw new Error(
                data.error ||
                "Failed to close post"
            );
        }

        const post =
            document.getElementById(
                "post-" + id
            );

        if (post) {
            post.remove();
        }

    } catch (error) {

        alert(error.message);
    }
}


function handleReplyKey(
    event,
    noteID,
    desktopID
) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendReply(
            noteID,
            desktopID
        );
    }
}


async function sendReply(
    noteID,
    desktopID
) {

    const input =
        document.getElementById(
            "reply-" + noteID
        );

    const button =
        document.getElementById(
            "send-" + noteID
        );

    const status =
        document.getElementById(
            "status-" + noteID
        );

    const content =
        input.value.trim();

    status.style.display =
        "none";

    if (!desktopID) {

        status.innerText =
            "This post is not associated with a desktop.";

        status.className =
            "reply-status reply-error";

        status.style.display =
            "block";

        return;
    }

    if (!content) {

        status.innerText =
            "Enter a message.";

        status.className =
            "reply-status reply-error";

        status.style.display =
            "block";

        return;
    }

    const form =
        new URLSearchParams();

    form.append(
        "id",
        desktopID
    );

    form.append(
        "content",
        content
    );

    button.disabled =
        true;

    button.innerText =
        "Sending...";

    try {

        const response =
            await fetch(
                "/api/desktops/send",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: form
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to send message"
            );
        }

        input.value = "";

        status.innerText =
            "Message sent.";

        status.className =
            "reply-status reply-success";

        status.style.display =
            "block";

    } catch (error) {

        status.innerText =
            error.message;

        status.className =
            "reply-status reply-error";

        status.style.display =
            "block";

    } finally {

        button.disabled =
            false;

        button.innerText =
            "Send";
    }
}

</script>

</body>

</html>
