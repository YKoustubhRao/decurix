\* Liveness of the protocol as implemented, with a cooperative person (README.md, "Termination").
\* check.sh runs it twice: as is, and with ScreenRequest = FALSE (a request the "nothing was run" doubt does not apply to).
SPECIFICATION LiveSpec

CONSTANTS
    Actions = {"G"}
    MaxModelTries = 3
    MaxReviewQuestions = 2
    MaxDoneRounds = 1
    MaxApprovalRounds = 1
    MinJ = 1
    MaxUntracedNudges = 2
    MaxEngineAttempts = 2
    MaxConfirmRounds = 1
    MaxSelfAnswers = 1
    MaxCmds = 2
    MaxHelps = 1
    OnScreen = TRUE
    ScreenRequest = TRUE
    ObedientModel = FALSE
    ApprovalReplies = {"yes", "noDoX"}
    QuestionReplies = {"answer", "handback"}
    ConfirmReplies = {"done", "other"}

PROPERTIES
    NoLivelock
    Termination
