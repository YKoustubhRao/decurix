\* Safety check of the protocol as implemented (see README.md).
\* Caps are the code's except where noted; smaller values keep TLC fast and do not change which paths exist.
SPECIFICATION Spec

CONSTANTS
    Actions = {"G", "S"}
    MaxModelTries = 8         \* code: 8
    MaxReviewQuestions = 2    \* code: 2
    MaxDoneRounds = 2         \* code: 4
    MaxApprovalRounds = 2     \* code: 6
    MinJ = 1                  \* code: 4
    MaxUntracedNudges = 2     \* code: 2
    MaxEngineAttempts = 2     \* code: 2
    MaxConfirmRounds = 1      \* code: 3
    MaxSelfAnswers = 1        \* code: 2
    MaxCmds = 3               \* assumption: the worker model's commands in the task
    MaxHelps = 1              \* assumption: the worker model's own questions in the task
    OnScreen = TRUE
    ScreenRequest = TRUE
    ObedientModel = FALSE
    ApprovalReplies = {"yes", "yesIf", "no", "noDoX", "noUse", "stop", "other"}
    QuestionReplies = {"answer", "handback", "yes", "yesAnswer", "noAnswer", "stop", "other"}
    ConfirmReplies = {"done", "yes", "no", "stop", "other"}

INVARIANTS
    TypeOK
    NoDeadlock
    ApprovalIntegrity
    AtMostOneAskPerAction
    DoubtsAccountedFor
    RefusalScopedToAction
    BareRefusalEndsTask
    RefusedActionNotReasked
    BoundedQuestions
    NoAnswerLost
    TransientNotFatal
    StopHonoured
